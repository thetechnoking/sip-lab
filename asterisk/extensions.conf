; Two destinations that make a noise, so you can prove media is flowing and
; not just that signalling succeeded.
;
; Neither uses a prompt file. The Asterisk container ships without the sound
; packages, so Playback() would fail silently and take the call with it --
; Echo() and Playtones() need nothing on disk.

[from-proxy]

; 6000 -- echo. Answer and send back whatever arrives. If the audio you receive
; is the audio you sent, then signalling AND media both worked end to end.
exten => 6000,1,NoOp(echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Echo()
 same => n,Hangup()

; 6001 -- a continuous tone. Used from part 5 (hold) onwards, where you need a
; call that stays up and is audibly, verifiably doing something. Playtones
; generates the audio in Asterisk, so there is no file to install.
exten => 6001,1,NoOp(tone for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playtones(1004/1000,0/1000)
 same => n,Wait(3600)
 same => n,StopPlaytones()
 same => n,Hangup()

; 6002 -- early media. Progress() sends a 183 Session Progress carrying SDP and
; starts a media path WITHOUT answering, so audio flows while the call is still
; ringing. Never sends a 200, so the dialog is never confirmed. Part two uses
; this to show the difference between 180 and 183.
exten => 6002,1,NoOp(early media for ${CALLERID(num)})
 same => n,Progress()
 same => n,Playtones(440+480/2000,0/4000)
 same => n,Wait(12)
 same => n,StopPlaytones()
 same => n,Hangup(19)

; 6003-6007 -- the refusal family. Part three is about telling these apart.
; Busy() and Congestion() are dedicated applications; the others come from a
; Q.850 hangup cause, which res_pjsip maps to a SIP status.

; The device is on a call.
exten => 6003,1,NoOp(busy for ${CALLERID(num)})
 same => n,Busy(3)
 same => n,Hangup()

; No circuits available -- a capacity problem, not a person problem.
exten => 6004,1,NoOp(congestion for ${CALLERID(num)})
 same => n,Congestion(3)
 same => n,Hangup()

; Cause 20: subscriber absent. Registered, but not reachable right now.
exten => 6005,1,NoOp(absent for ${CALLERID(num)})
 same => n,Hangup(20)

; Cause 21: call rejected. A human (or a policy) said no.
exten => 6006,1,NoOp(rejected for ${CALLERID(num)})
 same => n,Hangup(21)

; Cause 1: unallocated number. No such destination, anywhere.
exten => 6007,1,NoOp(unallocated for ${CALLERID(num)})
 same => n,Hangup(1)

; Anything else: reject with a specific code rather than dropping the call.
; Part 3 of the series is about why the code you pick here matters.
exten => _X.,1,NoOp(no such destination ${EXTEN})
 same => n,Hangup(1)
