; Asterisk in the lab is the media endpoint: the thing that can actually play
; audio at you. It trusts Kamailio and nothing else.
;
; One transport, one endpoint. No registration, no authentication -- Kamailio
; is the only peer that can reach it on this network, and in a lab that is
; boundary enough.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Kamailio, identified by the address it sends from. Docker resolves the
; service name to that address.
[kamailio]
type = endpoint
context = from-proxy
disallow = all
allow = ulaw,alaw
; The proxy is in the signalling path, so it sends us in-dialog requests.
; Trusting its Record-Route means replies go back the way they came.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Hold a call open while the far end is silent; useful when you pause a
; capture to read it.
direct_media = no

; Session timers (RFC 4028). The dialog is refreshed periodically with a
; re-INVITE that changes nothing, purely to prove both ends are still there.
; 90 is the lowest Session-Expires the RFC allows, and the refresh lands at
; about half of it -- which makes it observable inside a minute rather than
; half an hour. Part six uses this to show mid-call signalling that no
; application asked for.
timers = yes
timers_sess_expires = 90
timers_min_se = 90

[kamailio]
type = aor
max_contacts = 1

[kamailio]
type = identify
endpoint = kamailio
match = kamailio


; Outbound. Until now Asterisk only answered calls in this lab; to measure
; what a SIP status turns into on the way IN, it has to be able to place one
; and then report the cause it ended up with.
[proxy]
type = endpoint
context = from-proxy
disallow = all
allow = ulaw,alaw
aors = proxy
direct_media = no
; Do not let a failed outbound leg be reported as something vaguer than it is.
inband_progress = no

[proxy]
type = aor
contact = sip:kamailio:5060
