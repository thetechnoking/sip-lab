; Asterisk in the lab is the media endpoint: the thing that can actually play
; audio at you. It trusts Kamailio and nothing else.
;
; One transport, one endpoint. No registration, no authentication -- Kamailio
; is the only peer that can reach it on this network, and in a lab that is
; boundary enough.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Kamailio, identified by the address it sends from. Docker resolves the
; service name to that address.
[kamailio]
type = endpoint
context = from-proxy
disallow = all
allow = ulaw,alaw
; The proxy is in the signalling path, so it sends us in-dialog requests.
; Trusting its Record-Route means replies go back the way they came.
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; Hold a call open while the far end is silent; useful when you pause a
; capture to read it.
direct_media = no

[kamailio]
type = aor
max_contacts = 1

[kamailio]
type = identify
endpoint = kamailio
match = kamailio
