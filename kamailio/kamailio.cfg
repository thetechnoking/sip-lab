#!KAMAILIO
#
# SIP lab proxy + registrar.
#
# Deliberately small. This is not a production config -- there is no
# authentication, no TLS, no rate limiting and no database. Every one of those
# is a real topic and each gets its own treatment later in the series. What is
# here is the minimum that makes a proxy a proxy, so that a capture taken
# through it is readable rather than buried in features.
#
# Routing map:
#   alice, bob  -> a registered softphone (looked up in the location table)
#   6000        -> Asterisk  (echo test: hear your own voice)
#   6001        -> Asterisk  (music on hold, used from part 5 onwards)
#   7000        -> the Node app over drachtio
# Anything else -> 404.

####### Global Parameters #########

debug=3   # 3 shows xlog L_INFO; drop to 2 for quiet
log_stderror=yes          # so `docker compose logs kamailio` shows everything
memdbg=5
memlog=5

log_facility=LOG_LOCAL0

# No fork= here on purpose. The container image starts kamailio with -DD, which
# keeps it in the foreground where Docker needs it. Setting fork=yes in the
# config overrides that, kamailio daemonises, PID 1 exits and the container
# restarts in a loop.
children=4

/* Listen on the interface BY NAME, not on 0.0.0.0.
 *
 * Kamailio builds its Via and Record-Route headers from the listen address. If
 * that address is 0.0.0.0, the proxy ends up telling both endpoints to send
 * in-dialog requests -- the ACK, the BYE, every re-INVITE -- to 0.0.0.0, and
 * they will do exactly as they are told. The call appears to connect and then
 * nothing can ever end it.
 *
 * Naming the interface lets Kamailio resolve it to the container's real
 * address at startup, which also keeps this file portable: Docker hands out a
 * different subnet on every machine. */
listen=udp:eth0:5060
alias="siplab"

####### Modules #########

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"

# usrloc with db_mode 0 keeps registrations in memory only. Restarting the
# container forgets every phone, which is exactly what you want in a lab: the
# state is never stale and never mysterious.
modparam("usrloc", "db_mode", 0)

# Accept a short registration interval. Phones re-register often here so that a
# capture shows the refresh without a long wait.
modparam("registrar", "min_expires", 30)
modparam("registrar", "default_expires", 120)

####### Routing Logic #########

request_route {

    # Every inbound message, before any processing. In a teaching lab you want
    # to see the traffic even when the routing logic rejects it.
    xlog("L_INFO", "<<< $rm $ru  from $si:$sp  ($ci)
");

    # Drop obviously broken messages before they reach any logic.
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "malformed request from $si:$sp\n");
        exit;
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # ---- In-dialog requests -------------------------------------------
    #
    # Anything with a To-tag belongs to a dialog that already exists, so it is
    # routed by the Route header set we created with record_route() below --
    # not by looking the destination up again. This is the single most
    # important block in the file: it is why a BYE, a re-INVITE or a REFER
    # reaches the same places the INVITE did.
    if (has_totag()) {
        if (loose_route()) {
            xlog("L_INFO", "in-dialog $rm  $ci\n");
            route(RELAY);
        } else {
            sl_send_reply("404", "Not here");
        }
        exit;
    }

    # ---- CANCEL and ACK ------------------------------------------------
    #
    # CANCEL is answered hop-by-hop and must follow the INVITE it cancels,
    # which t_relay_cancel() does by matching the transaction.
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            xlog("L_INFO", "CANCEL for $ci\n");
            route(RELAY);
        }
        exit;
    }
    # A stray ACK with no transaction is an ACK for a 2xx -- its own
    # transaction, end to end. Relay it.
    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    if (!is_method("INVITE|REGISTER|OPTIONS|REFER|INFO|MESSAGE|SUBSCRIBE|NOTIFY")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # ---- REGISTER ------------------------------------------------------
    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
        }
        xlog("L_INFO", "REGISTER $fU -> $ct  (expires $hdr(Expires))\n");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # ---- Everything below starts a dialog, so stay in the path ---------
    #
    # record_route() adds a Record-Route header telling both endpoints to send
    # future in-dialog requests back through here. Decided once, at INVITE
    # time, and it cannot be revisited later.
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    route(DISPATCH);
}

# Where does this call go?
route[DISPATCH] {

    # Asterisk: 6000 echo test, 6001 music on hold.
    if ($rU =~ "^600[0-9]$") {
        xlog("L_INFO", "-> asterisk  $rU\n");
        $du = "sip:asterisk:5060";
        route(RELAY);
        exit;
    }

    # The Node application, reached through drachtio.
    if ($rU =~ "^700[0-9]$") {
        xlog("L_INFO", "-> node app  $rU\n");
        $du = "sip:drachtio:5060";
        route(RELAY);
        exit;
    }

    # A registered phone.
    if (!lookup("location")) {
        xlog("L_INFO", "no registration for $rU\n");
        # 404 means "no such user here"; 480 would mean "exists, not available
        # now". Part 3 of the series is about why that distinction matters.
        sl_send_reply("404", "Not Found");
        exit;
    }
    xlog("L_INFO", "-> phone  $rU at $ru\n");
    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
